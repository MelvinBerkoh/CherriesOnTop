<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram Grid Layout</title>
    <link rel="stylesheet" href="/Public/css/instagram.css" />
  </head>
  <body>
    <div class="instagram-feed-container">
      <div class="instagram-post">
        <iframe
          src="https://www.instagram.com/p/C8OAsiPsprN/?utm_source=ig_embed&amp;utm_campaign=loading"
          allowtransparency="true"
          frameborder="0"
          scrolling="no"
          allow="encrypted-media"
        ></iframe>
      </div>
      <div class="instagram-post">
        <iframe
          src="https://www.instagram.com/p/CU6s3vPg5aM/embed"
          allowtransparency="true"
          frameborder="0"
          scrolling="no"
          allow="encrypted-media"
        ></iframe>
      </div>
      <div class="instagram-post">
        <iframe
          src="https://www.instagram.com/p/CT4lQQgpTn7/embed"
          allowtransparency="true"
          frameborder="0"
          scrolling="no"
          allow="encrypted-media"
        ></iframe>
      </div>
      <!-- Add more Instagram posts as needed -->
    </div>
  </body>
</html>
