<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events Calendar | Cherries On Top</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="script.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Gwendolyn:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/Public/css/calender.css" />
  </head>
  <body>
    <div class="calendar-container">
      <h1>Where to Find Us</h1>
      <div class="calendar-header">
        <button id="prevMonth">&#9665;</button>
        <h2 id="monthYear"></h2>
        <button id="nextMonth">&#9655;</button>
      </div>
      <div class="calendar">
        <div class="days-of-week"></div>
        <div class="calendar-days"></div>
      </div>
    </div>
    <div id="eventDetails" class="event-details hidden">
      <h3>Event Details</h3>
      <p id="eventInfo">Click on a date to see event details.</p>
    </div>
  </body>
  <script src="/Public/js/cal.js"></script>
</html>
