<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embed Website Example</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f8f9fa;
      }
      iframe {
        border: 2px solid #ccc;
        border-radius: 10px;
        width: 80%;
        height: 80%;
      }
    </style>
  </head>
  <body>
    <iframe
      src="https://www.cherriesontopcatering.com"
      frameborder="0"
    ></iframe>
  </body>
</html>
